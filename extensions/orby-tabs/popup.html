<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Orby · Abas</title><link rel="stylesheet" href="popup.css">
<body><h1>Abas no Orby</h1><p>Imagens das abas visitadas, somente neste computador. Não troca abas automaticamente. Não funciona em janelas anônimas.</p>
<p>Para capturar páginas comuns, o navegador solicitará acesso aos sites. As imagens podem conter informações pessoais. Exclua os domínios que não deseja compartilhar.</p>
<label>Domínios excluídos (um por linha)<textarea id="excluded" placeholder="exemplo.com"></textarea></label>
<button id="enable">Ativar prévias</button><button id="disable">Desativar e apagar capturas</button>
<p id="status" role="status"></p><label>ID para conectar no Orby<input id="identity" readonly></label><button id="copy">Copiar ID</button>
<script src="popup.js"></script></body></html>
